<svg xmlns="http://www.w3.org/2000/svg" width="450" height="520" viewBox="0 0 450 520" role="img" aria-labelledby="title desc">
  <title id="title">Person climbing a ladder</title>
  <desc id="desc">A cheerful, polished flat-vector illustration of a person climbing a wooden ladder against a vivid blue background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2868df"/>
      <stop offset="1" stop-color="#1754c6"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#95602f"/>
      <stop offset=".5" stop-color="#ad7138"/>
      <stop offset="1" stop-color="#855126"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#123e91" flood-opacity=".24"/>
    </filter>
  </defs>

  <rect width="450" height="520" rx="0" fill="url(#bg)"/>
  <circle cx="355" cy="94" r="56" fill="#4a82eb" opacity=".22"/>
  <circle cx="92" cy="420" r="82" fill="#4a82eb" opacity=".14"/>

  <!-- Ladder rails -->
  <g stroke="url(#wood)" stroke-width="20" stroke-linecap="round" fill="none">
    <path d="M137 477 L176 49"/>
    <path d="M298 477 L337 49"/>
  </g>
  <g stroke="#c58a4d" stroke-width="16" stroke-linecap="round">
    <path d="M162 68 H322"/>
    <path d="M158 140 H315"/>
    <path d="M151 212 H308"/>
    <path d="M145 284 H302"/>
    <path d="M139 356 H295"/>
    <path d="M132 428 H289"/>
  </g>
  <g stroke="#e0a463" stroke-width="2" stroke-linecap="round" opacity=".65">
    <path d="M164 63 H319"/>
    <path d="M160 135 H312"/>
    <path d="M153 207 H305"/>
    <path d="M147 279 H299"/>
    <path d="M141 351 H292"/>
    <path d="M134 423 H286"/>
  </g>

  <!-- Person: raised arm and far arm -->
  <g filter="url(#softShadow)">
    <path d="M225 192 Q213 173 221 157 Q228 145 238 151 Q246 156 241 169 L237 198"
          fill="#ffd5ad" stroke="#f4bd8e" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="240" cy="151" r="11" fill="#ffd5ad"/>
    <path d="M173 221 Q154 214 149 230 Q146 242 164 257 L185 265 L197 247 Z"
          fill="#ffd5ad"/>
    <path d="M199 290 L180 337 Q176 349 190 354 L211 358 L232 313 Z" fill="#263b78"/>
    <path d="M231 310 L238 369 Q240 381 254 382 L269 381 Q278 378 272 368 L260 305 Z" fill="#30488d"/>
    <path d="M186 340 Q174 348 183 357 Q193 365 209 360 L219 355 Q222 350 214 346 Z" fill="#ffffff"/>
    <path d="M245 371 Q239 381 251 386 Q267 391 279 383 Q284 378 273 372 Z" fill="#ffffff"/>

    <!-- Backpack -->
    <path d="M163 218 Q159 207 169 204 L192 201 Q205 205 206 221 L206 278 Q204 289 193 289 L171 285 Q162 282 162 271 Z"
          fill="#ff8a3d"/>
    <path d="M172 214 Q169 209 178 208 L191 208 Q198 211 198 222 L198 266 Q197 273 188 272 L177 270 Z"
          fill="#ff9d4e" opacity=".9"/>

    <!-- Body -->
    <path d="M190 201 Q201 190 220 194 L237 202 Q246 208 245 223 L240 291 Q239 309 223 313 L194 312 Q180 308 181 291 L179 226 Q179 209 190 201 Z"
          fill="#ffd84d"/>
    <path d="M185 217 Q177 226 182 241 L191 259 Q195 266 202 261 Q207 257 203 250 L198 235 L201 219 Z"
          fill="#ffd5ad"/>
    <path d="M231 213 Q239 209 244 216 L237 248 Q235 258 228 256 Q221 254 224 246 Z"
          fill="#ffd5ad"/>

    <!-- Head and hair -->
    <path d="M184 176 Q187 151 214 149 Q241 150 245 177 L240 204 Q234 224 214 225 Q192 222 185 202 Z"
          fill="#ffd5ad"/>
    <path d="M181 177 Q184 153 205 147 Q225 141 239 152 Q248 159 245 175 Q233 162 220 161 Q201 160 184 173 Z"
          fill="#3b2a25"/>
    <path d="M183 174 Q176 178 178 188 L185 199 L190 194 L188 178 Z" fill="#ffd5ad"/>
    <circle cx="202" cy="183" r="5.7" fill="#2c2b2a"/>
    <circle cx="226" cy="183" r="5.7" fill="#2c2b2a"/>
    <path d="M205 199 Q214 208 224 198" fill="none" stroke="#c84d4b" stroke-width="5" stroke-linecap="round"/>
    <path d="M199 176 Q202 173 205 176" fill="none" stroke="#3b2a25" stroke-width="2" stroke-linecap="round" opacity=".55"/>
    <path d="M223 176 Q226 173 229 176" fill="none" stroke="#3b2a25" stroke-width="2" stroke-linecap="round" opacity=".55"/>
  </g>

  <!-- Small highlights for a cleaner, finished illustration -->
  <path d="M194 231 Q191 250 198 260" fill="none" stroke="#ffe887" stroke-width="3" stroke-linecap="round" opacity=".85"/>
  <path d="M214 232 Q222 234 229 230" fill="none" stroke="#fff0a0" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
</svg>